<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cozy Nature Editör</title><style>body{margin:0;overflow:hidden;font:14px system-ui;background:#18251c;color:#eef5e8}#panel{position:absolute;top:12px;left:12px;bottom:12px;width:265px;background:#15241fe9;border:1px solid #5b7659;border-radius:14px;display:flex;flex-direction:column;padding:14px;box-sizing:border-box;z-index:2;gap:9px}h2{margin:0;font-size:19px}#models{overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:6px}button,input{font:inherit}button{border:1px solid #607a5b;background:#314b38;color:white;border-radius:8px;padding:8px;cursor:pointer}button:hover,.selected{background:#63865b}#models button{font-size:11px;overflow-wrap:anywhere;min-height:116px;display:flex;flex-direction:column;align-items:center;gap:5px;padding:5px}#models button img{width:100%;height:82px;object-fit:contain;border-radius:6px;background:#d8e6dc}#models button span{line-height:1.2}#models button img.pending{opacity:.5}#info{font-size:12px;color:#cadcc8;line-height:1.5}#status{color:#f5db9d;font-size:12px}#top{position:absolute;top:12px;right:12px;background:#15241fe8;padding:12px;border-radius:10px;z-index:2;max-width:300px}#top button{margin:3px}#file{display:none}@media(max-width:650px){#panel{width:190px;padding:8px}#top{max-width:130px;top:auto;bottom:10px;font-size:11px}}</style></head><body><aside id="panel"><h2>🌿 Cozy Nature</h2><div id="info">Model seç → araziye tıkla → yerleştir.<br>Sol fare: kamera döndür · Sağ fare: kaydır · Tekerlek: yakınlaş.</div><input id="search" placeholder="Model ara: Pine, Rock..."/><div id="models"></div><div id="status">Hazır</div></aside><div id="top"><div id="active">Seçili model: Yok</div><button id="select">Seç / taşı</button><button id="rotate">Döndür ↻</button><button id="grow">Büyüt +</button><button id="shrink">Küçült −</button><button id="duplicate">Kopyala ⧉</button><button id="undo">Geri al ↶</button><button id="remove">Sil</button><button id="save">Dünyayı kaydet</button><button id="load">Dünya yükle</button><input type="file" id="file" accept=".json"/><div id="info">Nesneye tıklayarak seç. Sürükle: taşı · Ctrl+A: tümünü seç · Ctrl+C/V: kopyala/yapıştır · Ctrl+X: kes · Shift+tık: çoklu seçim · Ctrl+Z: geri al.</div></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js"}}</script><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/controls/OrbitControls.js';
import {GLTFLoader} from 'https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/loaders/GLTFLoader.js';
import {EffectComposer} from 'https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/postprocessing/EffectComposer.js';
import {RenderPass} from 'https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/postprocessing/RenderPass.js';
import {OutlinePass} from 'https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/postprocessing/OutlinePass.js';
import {OutputPass} from 'https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/postprocessing/OutputPass.js';
const names=["Bush_Common", "Bush_Common_Flowers", "Clover_1", "Clover_2", "CommonTree_1", "CommonTree_2", "CommonTree_3", "CommonTree_4", "CommonTree_5", "DeadTree_1", "DeadTree_2", "DeadTree_3", "DeadTree_4", "DeadTree_5", "Fern_1", "Flower_3_Group", "Flower_3_Single", "Flower_4_Group", "Flower_4_Single", "Grass_Common_Short", "Grass_Common_Tall", "Grass_Wispy_Short", "Grass_Wispy_Tall", "Mushroom_Common", "Mushroom_Laetiporus", "Pebble_Round_1", "Pebble_Round_2", "Pebble_Round_3", "Pebble_Round_4", "Pebble_Round_5", "Pebble_Square_1", "Pebble_Square_2", "Pebble_Square_3", "Pebble_Square_4", "Pebble_Square_5", "Pebble_Square_6", "Petal_1", "Petal_2", "Petal_3", "Petal_4", "Petal_5", "Pine_1", "Pine_2", "Pine_3", "Pine_4", "Pine_5", "Plant_1", "Plant_1_Big", "Plant_7", "Plant_7_Big", "RockPath_Round_Small_1", "RockPath_Round_Small_2", "RockPath_Round_Small_3", "RockPath_Round_Thin", "RockPath_Round_Wide", "RockPath_Square_Small_1", "RockPath_Square_Small_2", "RockPath_Square_Small_3", "RockPath_Square_Thin", "RockPath_Square_Wide", "Rock_Medium_1", "Rock_Medium_2", "Rock_Medium_3", "TwistedTree_1", "TwistedTree_2", "TwistedTree_3", "TwistedTree_4", "TwistedTree_5"];const scene=new THREE.Scene();scene.background=new THREE.Color('#a8d5d8');scene.fog=new THREE.Fog('#a8d5d8',75,180);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,500);camera.position.set(18,20,24);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);
const composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));const outlinePass=new OutlinePass(new THREE.Vector2(innerWidth,innerHeight),scene,camera);outlinePass.edgeStrength=5;outlinePass.edgeGlow=0;outlinePass.edgeThickness=1.5;outlinePass.pulsePeriod=0;outlinePass.visibleEdgeColor.set('#ffdf40');outlinePass.hiddenEdgeColor.set('#b48a00');composer.addPass(outlinePass);composer.addPass(new OutputPass());
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,0,0);controls.enableDamping=true;controls.maxPolarAngle=Math.PI/2-.02;controls.minDistance=3;controls.maxDistance=120;
scene.add(new THREE.HemisphereLight(0xf5fff5,0x68765b,2));const sun=new THREE.DirectionalLight(0xfff2ce,2.5);sun.position.set(-25,45,20);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-65;sun.shadow.camera.right=65;sun.shadow.camera.top=65;sun.shadow.camera.bottom=-65;scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(150,150),new THREE.MeshStandardMaterial({color:0x86a96e,roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);const grid=new THREE.GridHelper(150,75,0x718c61,0x718c61);grid.position.y=.012;grid.material.transparent=true;grid.material.opacity=.22;scene.add(grid);
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2(),loader=new GLTFLoader(),cache=new Map(),objects=[];let active=null,selected=null,down=null,drag=null;const selection=new Set();let clipboard=[];const dragPlane=new THREE.Plane(new THREE.Vector3(0,1,0),0),dragPoint=new THREE.Vector3();const $=id=>document.getElementById(id),status=t=>$('status').textContent=t;
const thumbnails=new Map();let thumbBusy=false;const thumbQueue=[];
const previewRenderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true,alpha:true});previewRenderer.setSize(160,130);previewRenderer.setPixelRatio(1);previewRenderer.outputColorSpace=THREE.SRGBColorSpace;
const previewScene=new THREE.Scene();previewScene.background=new THREE.Color('#d8e6dc');previewScene.add(new THREE.HemisphereLight(0xffffff,0x879b80,2.4));const previewSun=new THREE.DirectionalLight(0xffffff,2.6);previewSun.position.set(4,8,6);previewScene.add(previewSun);const previewCamera=new THREE.PerspectiveCamera(35,160/130,.01,1000);
async function makeThumb(name){const source=await template(name);const model=source.clone(true);const box=new THREE.Box3().setFromObject(model);if(box.isEmpty())throw Error('Boş model');const center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3());model.position.sub(center);previewScene.add(model);const radius=Math.max(size.length()*.5,.05);const distance=radius/Math.sin(THREE.MathUtils.degToRad(35/2))*1.3;previewCamera.position.set(distance*.65,distance*.45,distance*.8);previewCamera.lookAt(0,0,0);previewCamera.near=Math.max(.001,distance/100);previewCamera.far=distance*10;previewCamera.updateProjectionMatrix();previewRenderer.render(previewScene,previewCamera);const url=previewRenderer.domElement.toDataURL('image/png');previewScene.remove(model);return url}
async function drainThumbs(){if(thumbBusy)return;thumbBusy=true;while(thumbQueue.length){const name=thumbQueue.shift();if(thumbnails.has(name))continue;try{const url=await makeThumb(name);thumbnails.set(name,url);document.querySelectorAll('[data-model]').forEach(b=>{if(b.dataset.model===name){const img=b.querySelector('img');img.src=url;img.classList.remove('pending')}})}catch(e){console.warn('Önizleme yüklenemedi:',name,e);thumbnails.set(name,null)}}thumbBusy=false}
const thumbObserver=new IntersectionObserver(entries=>{for(const entry of entries){if(entry.isIntersecting){const n=entry.target.dataset.model;if(!thumbnails.has(n)&&!thumbQueue.includes(n))thumbQueue.push(n);thumbObserver.unobserve(entry.target)}}drainThumbs()},{root:$('models'),rootMargin:'120px'});
function catalog(){const filter=$('search').value.toLowerCase();$('models').replaceChildren();names.filter(n=>n.toLowerCase().includes(filter)).forEach(n=>{const b=document.createElement('button');b.dataset.model=n;const img=document.createElement('img');img.alt=n+' model önizlemesi';img.loading='lazy';if(thumbnails.get(n))img.src=thumbnails.get(n);else img.className='pending';const label=document.createElement('span');label.textContent=n.replaceAll('_',' ');b.append(img,label);if(n===active)b.className='selected';b.onclick=()=>{active=n;choose(null);catalog()};$('models').append(b);if(!thumbnails.has(n))thumbObserver.observe(b)})} $('search').oninput=catalog;catalog();
async function template(name){if(cache.has(name))return cache.get(name);const promise=new Promise((resolve,reject)=>loader.load('./assets/'+encodeURIComponent(name)+'.gltf',g=>resolve(g.scene),undefined,reject));cache.set(name,promise);return promise}
async function add(name,pos,rotation=0,scale=1){status('Yükleniyor: '+name);try{const model=(await template(name)).clone(true);model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});model.position.set(...pos);model.rotation.y=rotation;model.scale.setScalar(scale);model.userData={assetName:name};scene.add(model);objects.push(model);status('Eklendi: '+name);return model}catch(e){status('Model yüklenemedi: '+name);console.error(e)}}
const history=[];function snapshot(){return objects.map(o=>({o,p:o.position.clone(),r:o.rotation.y,s:o.scale.x}))}function remember(state=snapshot()){history.push(state);if(history.length>40)history.shift()}function undo(){if(!history.length){status("Geri alınacak işlem yok");return}const state=history.pop();objects.forEach(o=>scene.remove(o));objects.length=0;for(const item of state){item.o.position.copy(item.p);item.o.rotation.y=item.r;item.o.scale.setScalar(item.s);objects.push(item.o);scene.add(item.o)}choose(null);status("Son işlem geri alındı")}
function refreshSelection(){selected=[...selection][0]||null;outlinePass.selectedObjects=[...selection];$('active').textContent=selection.size>1?selection.size+' nesne seçili':selected?'Seçili: '+selected.userData.assetName:active?'Yerleştir: '+active:'Seçili nesne: Yok'}
function choose(o,additive=false){if(!additive)selection.clear();if(o){if(additive&&selection.has(o))selection.delete(o);else selection.add(o)}refreshSelection()}
function copySelection(){if(!selection.size){status('Kopyalamak için nesne seç');return}clipboard=[...selection].map(o=>({name:o.userData.assetName,position:o.position.toArray(),rotation:o.rotation.y,scale:o.scale.x}));status(clipboard.length+' nesne kopyalandı')}
async function pasteSelection(){if(!clipboard.length){status('Panoda nesne yok');return}const before=snapshot();const added=[];for(const item of clipboard){const o=await add(item.name,[item.position[0]+2,item.position[1],item.position[2]+2],item.rotation,item.scale);if(o)added.push(o)}if(added.length){remember(before);selection.clear();added.forEach(o=>selection.add(o));refreshSelection();clipboard=clipboard.map(item=>({...item,position:[item.position[0]+2,item.position[1],item.position[2]+2]}));status(added.length+' nesne yapıştırıldı')}}
function deleteSelection(){if(!selection.size)return;remember();for(const o of selection){scene.remove(o);objects.splice(objects.indexOf(o),1)}choose(null);status('Seçilen nesneler silindi')}
function point(e){const rect=renderer.domElement.getBoundingClientRect();mouse.set((e.clientX-rect.left)/rect.width*2-1,-(e.clientY-rect.top)/rect.height*2+1);ray.setFromCamera(mouse,camera)}
function rootOf(obj){while(obj&&obj.parent&&!objects.includes(obj))obj=obj.parent;return objects.includes(obj)?obj:null}
renderer.domElement.addEventListener('pointerdown',e=>{
 down={x:e.clientX,y:e.clientY,button:e.button};if(e.button!==0||active)return;
 point(e);const hits=ray.intersectObjects(objects,true);const target=hits.length?rootOf(hits[0].object):null;
 if(target){if(e.shiftKey){choose(target,true);down=null;return}if(!selection.has(target))choose(target);if(ray.ray.intersectPlane(dragPlane,dragPoint)){drag={before:snapshot(),pointerId:e.pointerId,object:target,group:[...selection].map(o=>({o,x:o.position.x,z:o.position.z})),startX:e.clientX,startY:e.clientY,offsetX:target.position.x-dragPoint.x,offsetZ:target.position.z-dragPoint.z,moved:false};controls.enabled=false;renderer.domElement.setPointerCapture(e.pointerId);e.stopImmediatePropagation();}}
},true);
renderer.domElement.addEventListener('pointermove',e=>{
 if(!drag||e.pointerId!==drag.pointerId)return;e.stopImmediatePropagation();
 if(!drag.moved&&Math.hypot(e.clientX-drag.startX,e.clientY-drag.startY)<5)return;
 drag.moved=true;controls.enabled=false;renderer.domElement.setPointerCapture(e.pointerId);
 point(e);if(ray.ray.intersectPlane(dragPlane,dragPoint)){const dx=dragPoint.x+drag.offsetX-drag.group.find(item=>item.o===drag.object).x,dz=dragPoint.z+drag.offsetZ-drag.group.find(item=>item.o===drag.object).z;for(const item of drag.group){item.o.position.x=item.x+dx;item.o.position.z=item.z+dz}status('Taşınıyor: '+drag.group.length+' nesne')}
},true);
function finishDrag(e){if(drag&&e.pointerId===drag.pointerId){if(drag.moved){remember(drag.before);status('Nesne taşındı')}drag=null;controls.enabled=true;}down=null}
renderer.domElement.addEventListener('pointerup',async e=>{
 if(drag&&e.pointerId===drag.pointerId)e.stopImmediatePropagation();
 const wasDrag=drag?.moved;const isClick=down&&down.button===0&&Math.hypot(e.clientX-down.x,e.clientY-down.y)<=5;
 finishDrag(e);if(wasDrag||!isClick)return;
 point(e);
 if(active){const hit=ray.intersectObject(ground)[0];if(hit){const before=snapshot();const model=await add(active,[hit.point.x,0,hit.point.z]);if(model){remember(before);choose(model)}}}
 else{const hits=ray.intersectObjects(objects,true);if(!hits.length)choose(null);else if(!selection.has(rootOf(hits[0].object)))choose(rootOf(hits[0].object))}
},true);
renderer.domElement.addEventListener('pointercancel',finishDrag);
$('select').onclick=()=>{active=null;choose(null);catalog();status('Seç / taşı: nesneye tıkla, sürükleyerek taşı')};
function edit(action){if(!selection.size){status('Önce nesne seç');return}remember();for(const o of [...selection])action(o);refreshSelection()}
$('duplicate').onclick=()=>{copySelection();pasteSelection()};$('undo').onclick=undo;
$('rotate').onclick=()=>edit(o=>o.rotation.y+=Math.PI/8);$('grow').onclick=()=>edit(o=>o.scale.multiplyScalar(1.15));$('shrink').onclick=()=>edit(o=>o.scale.multiplyScalar(1/1.15));$('remove').onclick=deleteSelection;
window.addEventListener('keydown',e=>{
 if(e.target.closest('input,textarea,[contenteditable="true"]'))return;
 const key=e.key.toLowerCase(),mod=e.ctrlKey||e.metaKey;
 if(mod&&['a','c','v','x','d','z'].includes(key)){e.preventDefault();
 if(key==='a'){active=null;selection.clear();objects.forEach(o=>selection.add(o));refreshSelection();status(objects.length+' nesne seçildi')}
 if(key==='c')copySelection();
 if(key==='v')pasteSelection();
 if(key==='x'){copySelection();deleteSelection()}
 if(key==='d')$('duplicate').click();
 if(key==='z')undo();
 return}
 if(e.key==='Escape'){active=null;choose(null);catalog()}
 if(key==='r')$('rotate').click();
 if(e.key==='Delete'||e.key==='Backspace')deleteSelection();
});
$('save').onclick=()=>{const data=objects.map(o=>({name:o.userData.assetName,position:o.position.toArray(),rotation:o.rotation.y,scale:o.scale.x}));const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='cozy-nature-dunya.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('load').onclick=()=>$('file').click();$('file').onchange=async e=>{try{const data=JSON.parse(await e.target.files[0].text());if(!Array.isArray(data))throw Error('Geçersiz kayıt');objects.forEach(o=>scene.remove(o));objects.length=0;history.length=0;active=null;choose(null);catalog();for(const item of data){if(names.includes(item.name)&&Array.isArray(item.position)&&item.position.length===3)await add(item.name,item.position,Number(item.rotation)||0,Number(item.scale)||1)}status('Dünya yüklendi')}catch(err){status('JSON yüklenemedi: '+err.message)}e.target.value=''};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight)});renderer.setAnimationLoop(()=>{controls.update();composer.render()});
</script></body></html>
